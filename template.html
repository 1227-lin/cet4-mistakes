<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="错题本">
<meta name="theme-color" content="#2E6B5A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>四级错题本</title>
<style>
  :root{
    --bg:#F6F3EC; --card:#FFFDF8; --ink:#211E1A; --muted:#8B8377; --line:#E7E1D4;
    --accent:#2E6B5A; --accent-soft:#EAF2EC; --warn:#B4603A;
    --p1:#2E6B5A; --p1bg:#EAF2EC; --p2:#9A5B25; --p2bg:#FBEFE0;
    --p3:#574C8E; --p3bg:#EDEAF6; --p4:#A63D30; --p4bg:#FBE7E4;
    --hl:#FBE9B7;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171614; --card:#201E1B; --ink:#EDE8DE; --muted:#9A9388; --line:#332F29;
      --accent:#6FBF9F; --accent-soft:#1E332B;
      --p1:#6FBF9F; --p1bg:#1E332B; --p2:#D9A05B; --p2bg:#332618;
      --p3:#A99BE0; --p3bg:#262238; --p4:#E08A7C; --p4bg:#38211D;
      --hl:#4A3E19;
    }
    .btn-primary,.chip.on,.tabs a.on{color:#12211C}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.65 -apple-system,"SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}
  code{font-size:12.5px;background:var(--accent-soft);padding:1px 5px;border-radius:4px}

  /* ---------- 顶栏 ---------- */
  .top{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .top-in{max-width:880px;margin:0 auto;padding:12px 20px 10px}
  .top-row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .brand{font-weight:650;letter-spacing:.3px}
  .brand span{color:var(--muted);font-weight:400;margin-left:6px;font-size:13px}
  .stats{margin-left:auto;display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .stats b{color:var(--ink);font-size:15px}
  .bar{height:4px;background:var(--line);border-radius:99px;margin-top:9px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .tabs{display:flex;gap:3px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
  .tabs a{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:13.5px;color:var(--muted)}
  .tabs a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

  main{max-width:880px;margin:0 auto;padding:20px 20px 60px}
  .view[hidden]{display:none}

  /* ---------- 通用 ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -16px rgba(0,0,0,.18);
  }
  .card h2{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .sec-h{font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin:4px 0 10px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
  .sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  .chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
  .search{
    display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:0 12px;height:38px;margin-bottom:12px;
  }
  .search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:14px;color:var(--ink)}
  .tag{display:inline-block;font-size:11px;line-height:1.7;padding:1px 8px;border-radius:99px;font-weight:600;letter-spacing:.2px}
  .tag.ok{color:var(--p1);background:var(--p1bg)}
  .tag.no{color:var(--p4);background:var(--p4bg)}
  .tag.topic{color:var(--p2);background:var(--p2bg);font-weight:500}

  /* ---------- 今日 ---------- */
  .today-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .tile{background:var(--p1bg);border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:1px}
  .tile.warn{background:var(--p2bg)}
  .tile b{font-size:21px;line-height:1.2}
  .tile span{font-size:12px;color:var(--muted)}
  .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

  /* ---------- 卷子（折叠） ---------- */
  .paper{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -16px rgba(0,0,0,.18)}
  .paper-head{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none}
  .paper-head:active{background:var(--accent-soft)}
  .ph-main{flex:1;min-width:0}
  .ptitle{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .ptitle h3{margin:0;font-size:16px;letter-spacing:-.01em}
  .pmeta{color:var(--muted);font-size:12px}
  .pstats{display:flex;gap:12px;margin-top:5px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .pstats b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pstats .bad b{color:var(--p4)}
  .chev{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:11px;transition:transform .18s}
  .paper.open .chev{transform:rotate(90deg)}
  .paper-body{display:none;padding:2px 18px 14px;border-top:1px solid var(--line)}
  .paper.open .paper-body{display:block}
  .secline{font-size:11.5px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:14px 0 2px}
  .secline::after{content:"";display:block;height:1px;background:var(--line);margin-top:5px}

  /* ---------- 题目 ---------- */
  .q{padding:12px 0;border-bottom:1px dashed var(--line)}
  .q:last-child{border-bottom:0}
  .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .no{font-weight:700;font-size:14px;min-width:24px}
  .mark{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .mark .yours{color:var(--p4);text-decoration:line-through;text-decoration-thickness:1.5px}
  .mark .right{color:var(--p1);font-weight:700;font-size:14px}
  .stem{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:15.5px;line-height:1.6;margin:0}
  .stem u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 10px;background:var(--accent-soft);border-radius:3px;font-weight:600}
  .zh{font-size:12.5px;color:var(--muted);margin:3px 0 0}
  .brief{font-size:13px;color:var(--muted);margin:4px 0 0}
  details{display:inline-block;width:100%}
  summary{cursor:pointer;list-style:none;font-size:12.5px;color:var(--accent);padding:6px 0 0;display:inline-flex;align-items:center;gap:5px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";font-size:10px;transition:.15s}
  details[open] summary::before{transform:rotate(90deg)}
  .dbody{font-size:14px;color:var(--muted);padding:4px 0 2px}
  .dbody p{margin:6px 0;line-height:1.7}
  .dbody b{color:var(--ink)}
  .dbody i{font-family:"Iowan Old Style",Georgia,serif;color:var(--ink);opacity:.85}
  .quote{background:var(--bg);border-left:3px solid var(--line);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0;font-family:"Iowan Old Style",Georgia,serif;font-size:13.5px;line-height:1.6}
  .quote em{background:var(--hl);font-style:normal;padding:0 2px;border-radius:2px}
  .whybox{display:flex;gap:8px;margin:8px 0 0}
  .whybox .ic{flex:0 0 auto;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800;margin-top:3px}
  .whybox.bad .ic{background:var(--p4bg);color:var(--p4)}
  .whybox.good .ic{background:var(--p1bg);color:var(--p1)}
  .whybox .tx{flex:1}
  .whybox .tx b{display:block;font-size:12.5px;margin-bottom:1px}

  /* ---------- 生词 ---------- */
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:10px}
  .wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;cursor:pointer}
  .wcard.done{opacity:.6}
  .wcard .w{font-size:16px;font-weight:700;padding-right:30px;word-break:break-word}
  .wcard .w small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:5px}
  .wcard .p{font-size:13.5px;margin:2px 0 5px}
  .wcard .e{font-family:"Iowan Old Style",Georgia,serif;font-size:12.5px;color:var(--muted);line-height:1.5}
  .wcard .e em{background:var(--hl);font-style:normal;padding:0 2px;border-radius:2px}
  .wcard .tick{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:11px;color:var(--muted)}
  .wcard.done .tick{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .wtag{display:inline-block;margin-top:7px;font-size:10.5px;color:var(--muted);background:var(--bg);border-radius:5px;padding:0 6px}

  /* ---------- 复习页 ---------- */
  .boxrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
  .boxcell{background:var(--bg);border-radius:9px;padding:8px 6px;text-align:center}
  .boxcell b{display:block;font-size:16px}
  .boxcell span{font-size:10.5px;color:var(--muted)}

  /* ---------- 弹层 ---------- */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(20,18,14,.45);display:none;align-items:center;justify-content:center;padding:18px}
  .modal.on{display:flex}
  .sheet{background:var(--card);border-radius:18px;width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .sheet .x{float:right;border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
  .rprog{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px}
  .rbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .rbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:.3s}
  .rq{text-align:center;padding:6px 0 4px;cursor:pointer}
  .rq .big{font-size:30px;font-weight:800;letter-spacing:-.01em;word-break:break-word}
  .rq .pos{font-size:13px;color:var(--muted)}
  .rq .stem{font-size:15px;text-align:left;margin-top:4px}
  .rback{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
  .rback .zh{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .rback .e{font-family:"Iowan Old Style",Georgia,serif;font-size:13px;color:var(--muted)}
  .rhint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
  .rbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .rbtn{border:1px solid var(--line);background:var(--bg);border-radius:12px;height:48px;font-size:14px;font-weight:600;cursor:pointer}
  .rbtn.again{background:var(--p4bg);border-color:transparent;color:var(--p4)}
  .rbtn.easy{background:var(--p1bg);border-color:transparent;color:var(--p1)}

  .foot{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .foot .sp{font-size:12px;color:var(--muted);margin-left:auto}
  .empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:13.5px}
  .ending{font-size:12px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.9}

  @media (max-width:620px){
    .top-in{padding:10px 14px 8px}
    main{padding:14px 14px 50px}
    .wgrid{grid-template-columns:1fr}
    .brand span{display:none}
    .stats{gap:10px;font-size:12px}
  }

  @media print{
    .top,.foot,.modal,.acts,.chips,.search,.chev{display:none!important}
    .view[hidden]{display:block!important}
    .paper-body{display:block!important}
    body{background:#fff}
    .card,.paper{box-shadow:none;border-color:#ddd;break-inside:avoid}
    .q{break-inside:avoid}
    details{display:block}
    details:not([open]) .dbody{display:block}
  }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="top-row">
      <div class="brand">四级错题本<span id="sub">—</span></div>
      <div class="stats">
        <div>卷 <b class="num" id="s-papers">0</b></div>
        <div>错题 <b class="num" id="s-wrong">0</b></div>
        <div>生词 <b class="num" id="s-words">0</b></div>
        <div>掌握 <b class="num" id="s-master">0%</b></div>
      </div>
    </div>
    <div class="bar"><i id="s-bar" style="width:0%"></i></div>
    <nav class="tabs" id="tabs">
      <a href="#/papers" data-tab="papers">错题</a>
      <a href="#/words" data-tab="words">生词</a>
      <a href="#/review" data-tab="review">复习</a>
    </nav>
  </div>
</div>

<main>
  <!-- ========== 错题页 ========== -->
  <section id="view-papers" class="view">
    <div class="card" id="today"></div>
    <div id="papers"></div>
  </section>

  <!-- ========== 生词页 ========== -->
  <section id="view-words" class="view" hidden>
    <div class="card">
      <h2>生词本</h2>
      <div class="sub" id="wordSub">—</div>
      <div class="search"><input id="ws" type="search" placeholder="搜单词 / 释义 / 例句"></div>
      <div class="chips" id="wordTags"></div>
      <div class="chips" id="wordStates"></div>
    </div>
    <div class="wgrid" id="wgrid"></div>
  </section>

  <!-- ========== 复习页 ========== -->
  <section id="view-review" class="view" hidden>
    <div class="card" id="reviewCard"></div>
    <div class="card" id="reviewStats"></div>
    <div class="card">
      <h2>怎么用</h2>
      <div class="sub">数据在 data.json，改完跑 <code>node build.mjs</code></div>
      <div class="dbody" style="font-size:13.5px">
        <p>· <b>错题</b>按卷子折叠，点卷名展开；看完可以标「已掌握」。</p>
        <p>· <b>生词</b>单独一页，点卡片记掌握，顶部进度条就是掌握率。</p>
        <p>· <b>复习</b>抽卡：错题抽「题干 → 答案」，生词抽「词 → 释义」，五档记忆盒。</p>
      </div>
      <div class="foot">
        <button class="btn" id="btn-export">导出进度</button>
        <button class="btn" id="btn-import">导入备份</button>
        <button class="btn" id="btn-print">打印成纸</button>
        <button class="btn" id="btn-reset">清空进度</button>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
        <span class="sp">进度只存在这台设备上</span>
      </div>
    </div>
    <div class="ending">
      四级错题本 · <span id="upd">—</span><br>
      数据源 data.json · 由 build.mjs 生成 · 不要直接改这个 HTML
    </div>
  </section>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const DATA = __DATA_JSON__;

/* ================= 状态 ================= */
const KEY = 'cet4b-v1';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} };
let S = load();
S.mastered = S.mastered || {};
S.box = S.box || {};
S.seen = S.seen || {};
S.open = S.open || {};
S.stat = S.stat || { answers: 0, right: 0 };

/* ================= 工具 ================= */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const PAPERS = DATA.papers || [];
const WORDS = DATA.words || [];
const ALLQ = [];
PAPERS.forEach(p => (p.questions||[]).forEach(q => ALLQ.push({p, q, id: p.id + '#' + q.no})));
const pad2 = n => String(n).padStart(2,'0');
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };

/* ================= 顶栏 ================= */
function renderTop(){
  const wrong = ALLQ.filter(x => !x.q.ok).length;
  const doneW = WORDS.filter(w => (S.box[w.w]||0) >= 5).length;
  const r = pct(doneW, WORDS.length);
  document.getElementById('s-papers').textContent = PAPERS.length;
  document.getElementById('s-wrong').textContent = wrong;
  document.getElementById('s-words').textContent = WORDS.length;
  document.getElementById('s-master').textContent = r + '%';
  document.getElementById('s-bar').style.width = r + '%';
  const last = PAPERS[0];
  document.getElementById('sub').textContent = last ? ('最近：' + last.title) : '还没有卷子';
  document.getElementById('upd').textContent = '更新于 ' + (DATA.meta?.updated || todayISO());
}

/* ================= 今日 ================= */
function renderToday(){
  const wrongTodo = ALLQ.filter(x => !x.q.ok && !S.mastered[x.id]);
  const wordTodo = WORDS.filter(w => (S.box[w.w]||1) < 5);
  document.getElementById('today').innerHTML =
    '<h2>今天</h2>' +
    '<div class="sub">' + todayISO() + ' · ' + PAPERS.length + ' 套卷 · ' + ALLQ.length + ' 道题</div>' +
    '<div class="today-grid">' +
      '<div class="tile' + (wrongTodo.length ? ' warn' : '') + '"><b class="num">' + wrongTodo.length + '</b><span>错题待复习</span></div>' +
      '<div class="tile"><b class="num">' + wordTodo.length + '</b><span>生词待复习</span></div>' +
    '</div>' +
    '<div class="acts">' +
      '<button class="btn btn-primary" data-act="review" data-kind="questions"' + (wrongTodo.length ? '' : ' disabled') + '>抽错题</button>' +
      '<button class="btn" data-act="review" data-kind="words"' + (wordTodo.length ? '' : ' disabled') + '>抽生词</button>' +
    '</div>';
}

/* ================= 错题：卷子列表（折叠） ================= */
let pFilter = 'all', pSearch = '';

function matchQ(p, q){
  if (pFilter === 'wrong' && q.ok) return false;
  if (pFilter === 'todo' && (q.ok || S.mastered[p.id + '#' + q.no])) return false;
  if (pSearch) {
    const hay = ((q.stem||'') + (q.zh||'') + (q.brief||'') + (q.tag||'') + q.no).toLowerCase();
    if (hay.indexOf(pSearch.toLowerCase()) < 0) return false;
  }
  return true;
}

function renderPapers(){
  const el = document.getElementById('papers');
  const out = [];
  out.push('<div class="sec-h">' + PAPERS.length + ' 套卷子</div>');
  out.push('<div class="chips">' +
    ['all|全部','wrong|只看错题','todo|未掌握'].map(x => {
      const [v,t] = x.split('|');
      return '<button class="chip' + (pFilter===v?' on':'') + '" data-act="pfilter" data-v="' + v + '">' + t + '</button>';
    }).join('') +
    '<button class="chip" data-act="expand-all">全部展开</button>' +
    '<button class="chip" data-act="collapse-all">全部收起</button>' +
    '</div>');
  out.push('<div class="search"><input id="qs" type="search" placeholder="搜题干 / 知识点" value="' + esc(pSearch) + '"></div>');

  if (!PAPERS.length) {
    out.push('<div class="empty">还没有卷子。</div>');
    el.innerHTML = out.join('');
    return;
  }

  PAPERS.forEach(p => {
    const qs = p.questions || [];
    const wrong = qs.filter(q => !q.ok).length;
    const ok = qs.length - wrong;
    const todo = qs.filter(q => !q.ok && !S.mastered[p.id + '#' + q.no]).length;
    const shown = qs.filter(q => matchQ(p, q));
    const searching = pSearch || pFilter !== 'all';
    const open = searching ? shown.length > 0 : !!S.open[p.id];

    out.push('<article class="paper' + (open ? ' open' : '') + '" data-pid="' + p.id + '">');
    out.push('<div class="paper-head" data-act="toggle-paper" data-id="' + p.id + '">');
    out.push('  <div class="ph-main">');
    out.push('    <div class="ptitle"><h3>' + esc(p.title) + '</h3>' +
      (p.date ? '<span class="pmeta">' + esc(p.date) + '</span>' : '') + '</div>');
    out.push('    <div class="pstats">' +
      '<span>正确率 <b>' + pct(ok, qs.length) + '%</b></span>' +
      '<span class="bad">错 <b>' + wrong + '</b></span>' +
      '<span>待复习 <b>' + todo + '</b></span>' +
      (p.note ? '<span>' + esc(p.note) + '</span>' : '') + '</div>');
    out.push('  </div><span class="chev">▶</span></div>');

    out.push('<div class="paper-body">');
    if (!shown.length) {
      out.push('<div class="empty">这一套没有符合筛选的题</div>');
    } else {
      ['A','B','C'].forEach(sec => {
        const list = shown.filter(q => q.sec === sec);
        if (!list.length) return;
        out.push('<div class="secline">Section ' + sec + ' · ' + ({A:'选词填空',B:'段落匹配',C:'仔细阅读'}[sec]) + '（' + list.length + ' 题）</div>');
        list.forEach(q => out.push(qRow(p, q)));
      });
    }
    out.push('</div></article>');
  });

  el.innerHTML = out.join('');
}

function qRow(p, q){
  const id = p.id + '#' + q.no;
  const h = ['<div class="q">'];
  h.push('<div class="qhead"><span class="no">' + esc(q.no) + '</span>');
  h.push(q.ok ? '<span class="tag ok">对</span>' : '<span class="tag no">错</span>');
  if (q.tag) h.push('<span class="tag topic">' + esc(q.tag) + '</span>');
  h.push('<span class="mark">' + (q.ok
      ? '<span class="right">' + esc(q.ans) + '</span>'
      : '<span class="yours">你 ' + esc(q.yours) + '</span> → <span class="right">' + esc(q.ans) + '</span>') + '</span>');
  h.push('</div>');
  if (q.stem) h.push('<p class="stem">' + q.stem + '</p>');
  if (q.zh) h.push('<p class="zh">' + esc(q.zh) + '</p>');
  if (q.ok) {
    h.push('<p class="brief">✓ ' + esc(q.brief || '') + '</p>');
  } else {
    h.push('<details><summary>解析</summary><div class="dbody">');
    if (q.quote) h.push('<div class="quote">' + q.quote + '</div>');
    if (q.why) h.push('<p>' + q.why + '</p>');
    if (q.you) h.push('<div class="whybox bad"><span class="ic">✗</span><div class="tx"><b>你为什么会选它</b><p>' + q.you + '</p></div></div>');
    if (q.fix) h.push('<div class="whybox good"><span class="ic">✓</span><div class="tx"><b>下次这么做</b><p>' + q.fix + '</p></div></div>');
    h.push('<p style="margin-top:12px"><button class="chip' + (S.mastered[id] ? ' on' : '') + '" data-act="master" data-id="' + id + '">' +
      (S.mastered[id] ? '已掌握 ✓' : '标记已掌握') + '</button></p>');
    h.push('</div></details>');
  }
  h.push('</div>');
  return h.join('');
}

/* ================= 生词页 ================= */
let wTag = '全部', wState = '全部', wSearch = '';

function renderWords(){
  const tags = ['全部'];
  WORDS.forEach(w => { if (w.tag && !tags.includes(w.tag)) tags.push(w.tag); });
  document.getElementById('wordTags').innerHTML = tags.map(t =>
    '<button class="chip' + (wTag===t?' on':'') + '" data-act="wtag" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('');
  document.getElementById('wordStates').innerHTML = ['全部','未掌握','已掌握'].map(s =>
    '<button class="chip' + (wState===s?' on':'') + '" data-act="wstate" data-v="' + s + '">' + s + '</button>').join('');

  const list = WORDS.filter(w => {
    if (wTag !== '全部' && w.tag !== wTag) return false;
    const done = (S.box[w.w]||0) >= 5;
    if (wState === '已掌握' && !done) return false;
    if (wState === '未掌握' && done) return false;
    if (wSearch) {
      const hay = (w.w + ' ' + w.zh + ' ' + (w.eg||'')).toLowerCase();
      if (hay.indexOf(wSearch.toLowerCase()) < 0) return false;
    }
    return true;
  });

  const doneN = WORDS.filter(w => (S.box[w.w]||0) >= 5).length;
  document.getElementById('wordSub').textContent = '共 ' + WORDS.length + ' 词 · 已掌握 ' + doneN + ' · 当前显示 ' + list.length;

  const grid = document.getElementById('wgrid');
  if (!list.length) { grid.innerHTML = '<div class="empty">没有匹配的单词</div>'; return; }
  grid.innerHTML = list.map(w => {
    const done = (S.box[w.w]||0) >= 5;
    const box = S.box[w.w] || 1;
    return '<div class="wcard' + (done?' done':'') + '" data-act="wmaster" data-w="' + esc(w.w) + '">' +
      '<div class="w">' + esc(w.w) + (w.pos ? '<small>' + esc(w.pos) + '</small>' : '') + '</div>' +
      '<div class="p">' + esc(w.zh) + '</div>' +
      '<div class="e">' + (w.eg||'') + '</div>' +
      '<div class="tick">' + (done ? '✓' : (box > 1 ? box : '○')) + '</div>' +
      (w.tag ? '<span class="wtag">' + esc(w.tag) + '</span>' : '') + '</div>';
  }).join('');
}

/* ================= 复习页 ================= */
function renderReview(){
  const wrongTodo = ALLQ.filter(x => !x.q.ok && !S.mastered[x.id]).length;
  const wordTodo = WORDS.filter(w => (S.box[w.w]||1) < 5).length;
  const doneW = WORDS.filter(w => (S.box[w.w]||0) >= 5).length;
  const doneQ = ALLQ.filter(x => !x.q.ok && S.mastered[x.id]).length;

  document.getElementById('reviewCard').innerHTML =
    '<h2>抽卡复习</h2>' +
    '<div class="sub">错题抽「题干 → 答案」，生词抽「词 → 释义」；各 20 张一轮</div>' +
    '<div class="today-grid">' +
      '<div class="tile' + (wrongTodo ? ' warn' : '') + '"><b class="num">' + wrongTodo + '</b><span>错题待复习</span></div>' +
      '<div class="tile"><b class="num">' + wordTodo + '</b><span>生词待复习</span></div>' +
    '</div>' +
    '<div class="acts">' +
      '<button class="btn btn-primary" data-act="review" data-kind="questions"' + (wrongTodo ? '' : ' disabled') + '>抽错题</button>' +
      '<button class="btn" data-act="review" data-kind="words"' + (wordTodo ? '' : ' disabled') + '>抽生词</button>' +
    '</div>';

  const boxes = [1,2,3,4,5].map(b => WORDS.filter(w => (S.box[w.w]||1) === b && (S.box[w.w]||1) < 5).length);
  document.getElementById('reviewStats').innerHTML =
    '<h2>记忆盒</h2><div class="sub">连对到第 5 档算掌握</div>' +
    '<div class="boxrow">' +
      '<div class="boxcell"><b class="num">' + boxes[0] + '</b><span>第 1 档</span></div>' +
      '<div class="boxcell"><b class="num">' + boxes[1] + '</b><span>第 2 档</span></div>' +
      '<div class="boxcell"><b class="num">' + boxes[2] + '</b><span>第 3 档</span></div>' +
      '<div class="boxcell"><b class="num">' + boxes[3] + '</b><span>第 4 档</span></div>' +
      '<div class="boxcell"><b class="num">' + doneW + '</b><span>已掌握</span></div>' +
    '</div>' +
    '<div class="pstats" style="margin-top:12px"><span>错题已掌握 <b>' + doneQ + '</b></span><span>累计复习 <b>' + (S.stat.answers||0) + '</b> 次</span></div>';
}

/* ================= 路由 ================= */
const VIEWS = { papers: 'view-papers', words: 'view-words', review: 'view-review' };
function route(){
  let h = (location.hash || '#/papers').replace(/^#\//, '');
  if (!VIEWS[h]) h = 'papers';
  document.querySelectorAll('.view').forEach(v => v.hidden = true);
  document.getElementById(VIEWS[h]).hidden = false;
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === h));
  if (h === 'papers') { renderToday(); renderPapers(); }
  if (h === 'words') renderWords();
  if (h === 'review') renderReview();
  window.scrollTo(0, 0);
}

/* ================= 弹层抽卡 ================= */
let rev = null;
function openReview(kind){
  const pool = kind === 'words'
    ? WORDS.filter(w => (S.box[w.w]||1) < 5)
    : ALLQ.filter(x => !x.q.ok && !S.mastered[x.id]);
  if (!pool.length) return;
  const queue = pool.slice().sort((a,b) => {
    if (kind === 'words') return (S.box[a.w]||1) - (S.box[b.w]||1) || (S.seen[a.w]||0) - (S.seen[b.w]||0);
    return String(a.id).localeCompare(String(b.id));
  }).slice(0, 20);
  rev = { kind, queue, i: 0, flipped: false, right: 0 };
  document.getElementById('modal').classList.add('on');
  drawReview();
}

function drawReview(){
  const sh = document.getElementById('sheet');
  if (!rev) return;
  const it = rev.queue[rev.i];
  if (!it) {
    sh.innerHTML = '<button class="x" data-act="close">×</button>' +
      '<div style="text-align:center;padding:26px 0"><div style="font-size:30px;font-weight:800">这轮结束</div>' +
      '<p style="color:var(--muted)">' + rev.queue.length + ' 张 · 记住 ' + rev.right + '</p></div>';
    return;
  }
  const isW = rev.kind === 'words';
  const w = it, q = it.q, p = it.p;
  const h = [];
  h.push('<button class="x" data-act="close">×</button>');
  h.push('<div class="rprog"><span>第 ' + (rev.i+1) + ' / ' + rev.queue.length + ' 张</span><span>对 ' + rev.right + '</span></div>');
  h.push('<div class="rbar"><i style="width:' + pct(rev.i, rev.queue.length) + '%"></i></div>');

  if (isW) {
    h.push('<div class="rq" data-act="flip"><div class="big">' + esc(w.w) + '</div>' +
      (w.pos ? '<div class="pos">' + esc(w.pos) + '</div>' : '') + '</div>');
    h.push(rev.flipped
      ? '<div class="rback"><div class="zh">' + esc(w.zh) + '</div><div class="e">' + (w.eg||'') + '</div></div>'
      : '<div class="rhint">点一下看释义</div>');
  } else {
    h.push('<div class="rq" data-act="flip"><div style="text-align:left"><span class="tag topic">' + esc(p.title) + '</span> ' +
      '<span class="no">' + esc(q.no) + '</span></div>' +
      '<p class="stem" style="margin-top:8px">' + (q.stem || esc(q.brief||'')) + '</p></div>');
    h.push(rev.flipped
      ? '<div class="rback"><div class="zh">答案：' + esc(q.ans) + '（你选 ' + esc(q.yours) + '）</div>' +
        (q.why ? '<p style="font-size:13.5px;color:var(--muted)">' + q.why + '</p>' : '') + '</div>'
      : '<div class="rhint">想好答案再点开</div>');
  }

  if (rev.flipped) {
    h.push('<div class="rbtns">' +
      '<button class="rbtn again" data-act="grade" data-g="0">忘了</button>' +
      '<button class="rbtn" data-act="grade" data-g="1">模糊</button>' +
      '<button class="rbtn easy" data-act="grade" data-g="2">记住了</button></div>');
  } else {
    h.push('<div class="rbtns"><button class="rbtn" data-act="flip">翻面</button></div>');
  }
  sh.innerHTML = h.join('');
}

function grade(g){
  const it = rev.queue[rev.i];
  if (rev.kind === 'words') {
    const key = it.w;
    let box = S.box[key] || 1;
    if (g === 0) box = 1;
    else if (g === 1) box = Math.max(1, box);
    else { box = Math.min(5, box + 1); rev.right++; }
    S.box[key] = box; S.seen[key] = Date.now();
  } else {
    if (g === 2) { S.mastered[it.id] = 1; rev.right++; }
    else if (g === 0) delete S.mastered[it.id];
  }
  S.stat.answers = (S.stat.answers || 0) + 1;
  save(S);
  rev.i++; rev.flipped = false;
  drawReview(); renderTop(); route();
}

/* ================= 事件 ================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'pfilter') { pFilter = t.dataset.v; renderPapers(); }
  else if (act === 'toggle-paper') {
    const id = t.dataset.id;
    S.open[id] = !S.open[id];
    save(S);
    renderPapers();
  }
  else if (act === 'expand-all') { PAPERS.forEach(p => S.open[p.id] = true); save(S); renderPapers(); }
  else if (act === 'collapse-all') { S.open = {}; save(S); renderPapers(); }
  else if (act === 'wtag') { wTag = t.dataset.v; renderWords(); }
  else if (act === 'wstate') { wState = t.dataset.v; renderWords(); }
  else if (act === 'master') {
    const id = t.dataset.id;
    if (S.mastered[id]) delete S.mastered[id]; else S.mastered[id] = 1;
    save(S); renderTop(); renderPapers(); renderToday();
  }
  else if (act === 'wmaster') {
    const w = t.dataset.w, box = S.box[w] || 1;
    S.box[w] = box >= 5 ? 1 : 5;
    save(S); renderTop(); renderWords();
  }
  else if (act === 'review') openReview(t.dataset.kind);
  else if (act === 'flip') { if (rev) { rev.flipped = true; drawReview(); } }
  else if (act === 'grade') grade(+t.dataset.g);
  else if (act === 'close') { document.getElementById('modal').classList.remove('on'); rev = null; }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'qs') {
    pSearch = e.target.value;
    const pos = e.target.selectionStart;
    renderPapers();
    const n = document.getElementById('qs');
    if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  }
  if (e.target.id === 'ws') {
    wSearch = e.target.value;
    const pos = e.target.selectionStart;
    renderWords();
    const n = document.getElementById('ws');
    if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  }
});

/* ================= 备份 ================= */
document.getElementById('btn-export').onclick = () => {
  const blob = new Blob([JSON.stringify({ v:1, at:new Date().toISOString(), state:S }, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cet4b-' + todayISO() + '.json';
  a.click();
};
document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
document.getElementById('file-import').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (o && o.state) {
        S = o.state;
        S.mastered=S.mastered||{}; S.box=S.box||{}; S.seen=S.seen||{}; S.open=S.open||{}; S.stat=S.stat||{answers:0};
        save(S); renderTop(); route();
      }
    } catch(err) {}
  };
  r.readAsText(f);
};
document.getElementById('btn-print').onclick = () => window.print();
document.getElementById('btn-reset').onclick = () => {
  if (!confirm('清空所有掌握标记和记忆盒？')) return;
  S = { mastered:{}, box:{}, seen:{}, open:{}, stat:{answers:0} };
  save(S); renderTop(); route();
};

let printOpened = [];
window.addEventListener('beforeprint', () => {
  printOpened = [];
  document.querySelectorAll('details').forEach(d => { if (!d.open) { d.open = true; printOpened.push(d); } });
});
window.addEventListener('afterprint', () => { printOpened.forEach(d => d.open = false); printOpened = []; });

/* ================= 启动 ================= */
window.addEventListener('hashchange', route);
renderTop();
route();
</script>
</body>
</html>
